<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="660" viewBox="0 0 1390 660" fill="none" role="img" aria-label="Merton mix: Bitcoin, Ethereum and Solana prices feed Inventory Drift. Its valuation signal (cheap or dear against Bitcoin's power-law fair value) and its trend gate (above or below the 140-day average) push together: cheap in an uptrend buys fast, dear in a downtrend sells fast, and when they disagree the weight holds. That gives each coin a weight, with breakout sleeves for Ethereum and a rebound entry for Solana. The Merton mix then splits the money between the coins whose own strategy is on, giving more to the best recent gain-to-loss, capped at each coin's weight, with the rest in cash. It rebalances daily and pauses for review if a health test says the edge has broken.">
