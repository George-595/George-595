<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="660" viewBox="0 0 1390 660" fill="none" role="img" aria-label="Merton mix: Bitcoin, Ethereum and Solana prices feed Inventory Drift, where a valuation signal and a trend gate push together: cheap in an uptrend buys fast, dear in a downtrend sells fast, and when they disagree the weight holds. Each coin gets a weight, then the Merton mix splits the money between the coins that are on, capped at each coin's weight, with the rest in cash. It rebalances daily and pauses for review if a health test fails.">
