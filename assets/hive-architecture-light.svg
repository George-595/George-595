<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="660" viewBox="0 0 1390 660" fill="none" role="img" aria-label="Hive: work from you, Slack and Teams, tickets and nightly CI flows into Hive, which picks the model, runs in auto mode, guards CPU and RAM, heals itself, survives compaction and keeps the prompt cache warm. It runs Claude Code workers and a browser agent, holds work when the machine is busy, and ships merged PRs, a live panel and voice and Slack updates.">
