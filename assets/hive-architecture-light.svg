<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" fill="none" role="img" aria-label="Hive architecture: inputs from you, Slack and Teams, tickets and nightly CI flow into the Hive orchestrator, which splits work into jobs, routes each to a model, schedules against machine resources and runs Claude Code workers in their own git worktrees, producing pull requests, a live panel, a Build Room dashboard and spoken and Slack updates.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <style>
      .t{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace}
      .h{fill:#09090b;font-weight:700}
      .s{fill:#52525b}
      .k{fill:#1d4ed8;font-weight:700}
      .card{fill:#ffffff;stroke:#d4d4d8}
      .lbl{fill:#71717a;font-size:13px;letter-spacing:1.5px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="950" rx="14" fill="url(#bg)"/>

  <g class="t">
  <!-- ============ INPUTS ============ -->
  <text x="40" y="44" class="m lbl">INPUT</text>
  <g font-size="15">
    <rect x="40"  y="58" width="265" height="58" rx="10" class="card"/>
    <text x="172" y="83" text-anchor="middle" class="h">You</text>
    <text x="172" y="104" text-anchor="middle" class="s" font-size="13">typed, or by voice</text>

    <rect x="325" y="58" width="265" height="58" rx="10" class="card"/>
    <text x="457" y="83" text-anchor="middle" class="h">Slack &amp; Teams</text>
    <text x="457" y="104" text-anchor="middle" class="s" font-size="13">monitored, treated as untrusted</text>

    <rect x="610" y="58" width="265" height="58" rx="10" class="card"/>
    <text x="742" y="83" text-anchor="middle" class="h">Tickets, notes &amp; files</text>
    <text x="742" y="104" text-anchor="middle" class="s" font-size="13">recorded verbatim first</text>

    <rect x="895" y="58" width="265" height="58" rx="10" class="card"/>
    <text x="1027" y="83" text-anchor="middle" class="h">Nightly CI failures</text>
    <text x="1027" y="104" text-anchor="middle" class="s" font-size="13">picked up automatically</text>
  </g>
  <g stroke="#a1a1aa" stroke-width="1.6">
    <path d="M172 116 V166" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M457 116 V166" marker-end="url(#a)"/>
    <path d="M742 116 V166" marker-end="url(#a)"/>
    <path d="M1027 116 V166" marker-end="url(#a)"/>
  </g>
  <text x="182" y="146" class="s" font-size="12">asks only you</text>

  <!-- ============ ORCHESTRATOR ============ -->
  <rect x="40" y="172" width="1120" height="336" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="214" class="h" font-size="26" letter-spacing="-0.6">🐝 Hive orchestrator</text>
  <text x="1130" y="203" text-anchor="end" class="s" font-size="14">plans, routes and supervises; edits no code itself</text>
  <text x="1130" y="223" text-anchor="end" class="s" font-size="14">runs on a laptop, or unattended 24/7 on a server</text>

  <!-- pipeline -->
  <g font-size="14" font-weight="600">
    <rect x="70"  y="240" width="160" height="40" rx="20" fill="#dbeafe"/><text x="150"  y="265" text-anchor="middle" fill="#1e3a8a">1 · Split into jobs</text>
    <rect x="248" y="240" width="160" height="40" rx="20" fill="#dbeafe"/><text x="328"  y="265" text-anchor="middle" fill="#1e3a8a">2 · Route to a model</text>
    <rect x="426" y="240" width="160" height="40" rx="20" fill="#dbeafe"/><text x="506"  y="265" text-anchor="middle" fill="#1e3a8a">3 · Schedule</text>
    <rect x="604" y="240" width="160" height="40" rx="20" fill="#dbeafe"/><text x="684"  y="265" text-anchor="middle" fill="#1e3a8a">4 · Spawn workers</text>
    <rect x="782" y="240" width="160" height="40" rx="20" fill="#dbeafe"/><text x="862"  y="265" text-anchor="middle" fill="#1e3a8a">5 · Supervise</text>
    <rect x="960" y="240" width="170" height="40" rx="20" fill="#2563eb"/><text x="1045" y="265" text-anchor="middle" fill="#ffffff">6 · Merge &amp; retire</text>
  </g>
  <g fill="#93c5fd" font-size="16"><text x="233" y="266">›</text><text x="411" y="266">›</text><text x="589" y="266">›</text><text x="767" y="266">›</text><text x="945" y="266">›</text></g>

  <!-- subsystems -->
  <g font-size="14">
    <rect x="70" y="300" width="200" height="186" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="88" y="328" class="k" font-size="16">Model router</text>
    <text x="88" y="356" class="s">job kind → model + effort</text>
    <text x="88" y="380" class="s">Opus for core, security</text>
    <text x="88" y="402" class="s">and design work</text>
    <text x="88" y="426" class="s">Sonnet for features, tests</text>
    <text x="88" y="450" class="s">only ever escalates</text>

    <rect x="284" y="300" width="200" height="186" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="302" y="328" class="k" font-size="16">Resource scheduler</text>
    <text x="302" y="356" class="s">worker cap</text>
    <text x="302" y="380" class="s">CPU slots gate heavy runs</text>
    <text x="302" y="404" class="s">memory &amp; CPU ceilings</text>
    <text x="302" y="428" class="s">holds new workers under</text>
    <text x="302" y="450" class="s">memory pressure</text>

    <rect x="498" y="300" width="200" height="186" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="516" y="328" class="k" font-size="16">Ledger</text>
    <text x="516" y="356" class="s">on-disk jobs, workers,</text>
    <text x="516" y="378" class="s">queue and decisions</text>
    <text x="516" y="402" class="s">your words kept verbatim</text>
    <text x="516" y="426" class="s">recall rebuilds context</text>
    <text x="516" y="448" class="s">after compaction</text>

    <rect x="712" y="300" width="200" height="186" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="730" y="328" class="k" font-size="16">Signed control</text>
    <text x="730" y="356" class="s">single-use, verified</text>
    <text x="730" y="378" class="s">commands to workers:</text>
    <text x="730" y="402" class="s">compact · goal · loop ·</text>
    <text x="730" y="424" class="s">model switch</text>
    <text x="730" y="448" class="s">run at turn boundaries</text>

    <rect x="926" y="300" width="204" height="186" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="944" y="328" class="k" font-size="16">Self-healing</text>
    <text x="944" y="356" class="s">snapshot → compact →</text>
    <text x="944" y="378" class="s">re-brief from the ledger</text>
    <text x="944" y="402" class="s">keep-warm pings hold</text>
    <text x="944" y="424" class="s">the prompt cache</text>
    <text x="944" y="448" class="s">watchdog + self-relaunch</text>
  </g>

  <!-- orchestrator <-> workers -->
  <path d="M560 508 V570" stroke="#2563eb" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M640 570 V508" stroke="#2563eb" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="548" y="545" text-anchor="end" class="s" font-size="13">brief from the ledger</text>
  <text x="652" y="545" class="m" fill="#1d4ed8" font-size="12">STARTED · PROGRESS · QUESTION · DONE</text>

  <!-- ============ WORKERS ============ -->
  <rect x="40" y="576" width="1120" height="190" rx="14" fill="none" stroke="#d4d4d8"/>
  <text x="70" y="608" class="h" font-size="17">Workers</text>
  <text x="146" y="608" class="s" font-size="14">Claude Code sessions, each in its own git worktree</text>
  <text x="1130" y="608" text-anchor="end" class="s" font-size="14">terminal tabs · VS Code · background</text>
  <g font-size="15">
    <rect x="70" y="626" width="200" height="116" rx="10" class="card"/>
    <circle cx="92" cy="652" r="5" fill="#22c55e"/><text x="106" y="657" class="h">Worker 1</text>
    <text x="88" y="684" class="s" font-size="13">feature · Sonnet</text>
    <text x="88" y="708" fill="#15803d" font-size="13">building</text>

    <rect x="284" y="626" width="200" height="116" rx="10" class="card"/>
    <circle cx="306" cy="652" r="5" fill="#3b82f6"/><text x="320" y="657" class="h">Worker 2</text>
    <text x="302" y="684" class="s" font-size="13">tests · Sonnet</text>
    <text x="302" y="708" fill="#1d4ed8" font-size="13">PR open, CI running</text>

    <rect x="498" y="626" width="200" height="116" rx="10" class="card"/>
    <circle cx="520" cy="652" r="5" fill="#f59e0b"/><text x="534" y="657" class="h">Worker 3</text>
    <text x="516" y="684" class="s" font-size="13">security · Opus</text>
    <text x="516" y="708" fill="#b45309" font-size="13">waiting · cache kept warm</text>

    <rect x="712" y="626" width="200" height="116" rx="10" fill="none" stroke="#d4d4d8" stroke-dasharray="4 5"/>
    <text x="730" y="657" fill="#71717a" font-weight="700">Worker N</text>
    <text x="730" y="684" class="s" font-size="13">up to the cap</text>
    <text x="730" y="708" fill="#71717a" font-size="13">more jobs queue in order</text>

    <rect x="926" y="626" width="204" height="116" rx="10" fill="#ffffff" stroke="#2563eb" stroke-dasharray="3 3"/>
    <text x="944" y="657" class="h">Browser agent</text>
    <text x="944" y="684" class="s" font-size="13">drives a real browser</text>
    <text x="944" y="708" class="s" font-size="13">to check UI for workers</text>
  </g>
  <path d="M912 684 H922" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="2 2"/>

  <!-- workers -> outputs -->
  <path d="M600 766 V800" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ OUTPUTS ============ -->
  <text x="40" y="796" class="m lbl">OUTPUT</text>
  <g font-size="15">
    <rect x="40"  y="806" width="208" height="64" rx="10" fill="#eff6ff" stroke="#2563eb"/>
    <text x="144" y="832" text-anchor="middle" class="h">Pull requests</text>
    <text x="144" y="854" text-anchor="middle" class="s" font-size="13">CI, auto-merge, cleanup</text>

    <rect x="268" y="806" width="208" height="64" rx="10" class="card"/>
    <text x="372" y="832" text-anchor="middle" class="h">Live panel</text>
    <text x="372" y="854" text-anchor="middle" class="s" font-size="13">ETAs, CI, context, queue</text>

    <rect x="496" y="806" width="208" height="64" rx="10" class="card"/>
    <text x="600" y="832" text-anchor="middle" class="h">Build Room</text>
    <text x="600" y="854" text-anchor="middle" class="s" font-size="13">progress with screenshots</text>

    <rect x="724" y="806" width="208" height="64" rx="10" class="card"/>
    <text x="828" y="832" text-anchor="middle" class="h">Spoken updates</text>
    <text x="828" y="854" text-anchor="middle" class="s" font-size="13">local voice, never over you</text>

    <rect x="952" y="806" width="208" height="64" rx="10" class="card"/>
    <text x="1056" y="832" text-anchor="middle" class="h">Slack updates</text>
    <text x="1056" y="854" text-anchor="middle" class="s" font-size="13">gated and rate-capped</text>
  </g>

  <!-- footer stats -->
  <line x1="40" y1="896" x2="1160" y2="896" stroke="#e4e4e7"/>
  <text x="600" y="926" text-anchor="middle" class="m" fill="#52525b" font-size="14">~148k lines · 1,800+ test cases · 8 job kinds · 3 hosts · macOS · Windows (WSL) · Linux</text>
  </g>
</svg>
